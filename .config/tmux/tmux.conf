# vim: set ft=tmux:

# Plugin path (keep plugins out of dotfiles)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'roosta/tmux-fuzzback'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Modular config
source-file "$HOME/.config/tmux/options.conf"
source-file "$HOME/.config/tmux/theme.conf"
source-file "$HOME/.config/tmux/statusline.conf"
source-file "$HOME/.config/tmux/keybindings.conf"
source-file "$HOME/.config/tmux/utility.conf"

# Load selected theme, then enforce unified theme hotkey
run-shell "$HOME/.config/tmux/scripts/theme-load.sh"
run-shell "$HOME/.config/tmux/scripts/theme-overlay.sh"
run-shell "$HOME/.config/tmux/scripts/theme-rebind.sh"

# Initialize TPM (keep at bottom)
run "$HOME/.tmux/plugins/tpm/tpm"
