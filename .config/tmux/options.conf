# vim: set ft=tmux:

# Plugin options
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Fuzzback (scrollback search)
set -g @fuzzback-bind /
set -g @fuzzback-popup 1
set -g @fuzzback-popup-size '80%'

# Terminal
set -g extended-keys on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g allow-passthrough on

# Mouse
set -g mouse on
bind -T root WheelUpPane if-shell -F "#{pane_in_mode}" "send-keys -X scroll-up" "if-shell -F \"#{mouse_any_flag}\" \"send-keys -M\" \"copy-mode -eu\""
bind -T root WheelDownPane if-shell -F "#{pane_in_mode}" "send-keys -X scroll-down" "send-keys -M"

# Windows and panes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000

# Escape time (keep > 0 for Alt/Meta key responsiveness)
set -s escape-time 10

# Clipboard
set -g @copy_cmd "wl-copy 2>/dev/null || xclip -in -selection clipboard"

# Vi copy mode
set-window-option -g mode-keys vi
