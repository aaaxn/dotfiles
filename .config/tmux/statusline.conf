# vim: set ft=tmux:

# Catppuccin window style
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_text ' #(~/.config/tmux/scripts/git-status.sh "#{window_id}") '
set -g @catppuccin_window_current_text ' #(~/.config/tmux/scripts/git-status.sh "#{window_id}") '

# Separators
set -g @catppuccin_status_left_separator  ""
set -g @catppuccin_status_middle_separator " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# Status bar
set -gu @catppuccin_directory_icon
set -gu @catppuccin_session_icon
set -g @catppuccin_directory_text "#{pane_current_path}"
set -g status-left-length 200
set -g status-right-length 200
set -g status-left ""
set -g status-right ""
set -g status-position bottom
