# vim: set ft=tmux:

# Persisted theme selection (fallback to catppuccin)
if-shell "[ -f \"$HOME/.config/tmux/theme-state.conf\" ]" \
  "source-file \"$HOME/.config/tmux/theme-state.conf\"" \
  "set -g @selected_tmux_theme catppuccin"

# Theme defaults
set -g @catppuccin_flavor "mocha"
set -g @tokyo-night-tmux_theme "storm"
