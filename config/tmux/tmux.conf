# vim: set ft=tmux:

# Plugin path (keep plugins out of dotfiles)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# Persisted selected theme (fallback to catppuccin)
if-shell "[ -f \"$HOME/.config/tmux/theme-state.conf\" ]" "source-file \"$HOME/.config/tmux/theme-state.conf\"" "set -g @selected_tmux_theme catppuccin"

# Theme defaults
set -g @catppuccin_flavor "mocha"
set -g @tokyo-night-tmux_theme "storm"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'roosta/tmux-fuzzback'

# Fuzzback config (scrollback search)
set -g @fuzzback-bind /
set -g @fuzzback-popup 1
set -g @fuzzback-popup-size '80%'

# Window picker (prefix + w)
bind w run-shell "$HOME/.config/tmux/scripts/window-picker.sh"

# Theme picker (prefix + T)
bind T run-shell "$HOME/.config/tmux/scripts/theme-menu.sh"

# Keybind cheatsheet (prefix + ?)
bind ? display-popup -E -T "Tmux Keybinds" -w 84% -h 84% "$HOME/.config/tmux/scripts/keybinds-cheatsheet.sh"
# Git popup (prefix + g)
bind g display-popup -E -T "Git" -w 72 -h 16 -d "#{pane_current_path}" "$HOME/.config/tmux/scripts/git-popup.sh"

# Catppuccin config
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_text ' #(~/.config/tmux/scripts/git-status.sh "#{window_id}") '
set -g @catppuccin_window_current_text ' #(~/.config/tmux/scripts/git-status.sh "#{window_id}") '
set -g @catppuccin_status_left_separator  ""
set -g @catppuccin_status_middle_separator " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# Status bar modules
# If you previously set these icons to "", tmux keeps that value across reloads.
# Unset so the theme can apply its defaults again.
set -gu @catppuccin_directory_icon
set -gu @catppuccin_session_icon

set -g @catppuccin_directory_text "#{pane_current_path}"
set -g status-left-length 200
set -g status-right-length 200
set -g status-left ""
set -g status-right ""
set -g status-position bottom

# Terminal settings
set -g extended-keys on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g allow-passthrough on
set -g default-shell "/usr/bin/zsh"

# Enable mouse support
set -g mouse on

# Make wheel scroll feel natural in tmux history.
# Use `copy-mode -eu` to enter copy mode and move up immediately,
# avoiding command-chaining parsing issues on some tmux builds.
bind -T root WheelUpPane if-shell -F "#{pane_in_mode}" "send-keys -X scroll-up" "if-shell -F \"#{mouse_any_flag}\" \"send-keys -M\" \"copy-mode -eu\""
bind -T root WheelDownPane if-shell -F "#{pane_in_mode}" "send-keys -X scroll-down" "send-keys -M"

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase history limit
set -g history-limit 50000

#
# Keybinds (kept from your existing config)
#

# Address vim mode switching delay.
# NOTE: Meta/Alt keys (como prefixo M-e) precisam de um escape-time > 0 para funcionar bem.
set -s escape-time 10

# Prefix: Alt+e (default, overridden by persisted choice)
unbind C-b
set -g prefix M-e
bind e send-prefix
if-shell '[ -f "$HOME/.local/state/tmux/prefix.conf" ]' 'source-file "$HOME/.local/state/tmux/prefix.conf"'

# Pane resizing with vim-like keys (-r allows repeat without prefix)
# Use - and = for vertical, [ and ] for horizontal resizing
bind -r - resize-pane -D 2
bind -r = resize-pane -U 2
bind -r ] resize-pane -R 2
bind -r [ resize-pane -L 2

# Bind delete key to equalize all panes using tiled layout
bind -r DC select-layout tiled

# Window and pane creation with current path preservation
unbind %
unbind '"'
bind \\ split-window -h -c "#{pane_current_path}"      # Backslash for horizontal split
bind Enter split-window -v -c "#{pane_current_path}"   # Enter for vertical split
bind c new-window -c "#{pane_current_path}"            # New window in current path

# Bind x to kill current pane
bind x kill-pane

# Set manual pane label used by window status (agent + <label>).
bind P command-prompt -p "Codex label" "set -p @manual_pane_label '%%'"

# Bind m to maximize the current pane
unbind z
unbind m
bind m resize-pane -Z

# Reload config
unbind r
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display-message "Config reloaded!"

# Enable vim keys for copy mode
set-window-option -g mode-keys vi

# Clipboard (Ubuntu):
# - Wayland: wl-copy
# - X11: xclip
# Comando tenta wl-copy e, se falhar, usa xclip.
set -g @copy_cmd "wl-copy 2>/dev/null || xclip -in -selection clipboard"

# Copy mode with vim-like keybindings
bind v copy-mode  # Enter copy mode with prefix+v

bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi Escape send-keys -X clear-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"
bind -T copy-mode WheelUpPane send-keys -X scroll-up
bind -T copy-mode WheelDownPane send-keys -X scroll-down
bind -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X scroll-down

# Disable numeric repeat prompt in copy-mode to avoid "(repeat)" bar while scrolling.
unbind -T copy-mode M-1
unbind -T copy-mode M-2
unbind -T copy-mode M-3
unbind -T copy-mode M-4
unbind -T copy-mode M-5
unbind -T copy-mode M-6
unbind -T copy-mode M-7
unbind -T copy-mode M-8
unbind -T copy-mode M-9
unbind -T copy-mode-vi 1
unbind -T copy-mode-vi 2
unbind -T copy-mode-vi 3
unbind -T copy-mode-vi 4
unbind -T copy-mode-vi 5
unbind -T copy-mode-vi 6
unbind -T copy-mode-vi 7
unbind -T copy-mode-vi 8
unbind -T copy-mode-vi 9

# Enable pane navigation while in copy mode (works with vim-tmux-navigator)
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode-vi C-\\ select-pane -l
bind -T copy-mode-vi C-Space select-pane -t:.+

# Load selected theme, then enforce unified theme hotkey.
run-shell "$HOME/.config/tmux/scripts/theme-load.sh"
run-shell "$HOME/.config/tmux/scripts/theme-overlay.sh"
run-shell "$HOME/.config/tmux/scripts/theme-rebind.sh"

# Initialize TPM (keep this at the very bottom)
run "$HOME/.tmux/plugins/tpm/tpm"
